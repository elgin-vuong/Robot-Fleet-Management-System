# Backend CI: formatting, linting, and the real test suite against real
# Postgres/Redis/Kafka via the repo's own docker-compose.yml — not GitHub
# Actions service containers. Chosen deliberately: this repo's Kafka needs
# a specific dual-listener KRaft setup (see docker-compose.yml's comments)
# for host processes to reach it, which already exists and is exercised
# daily in local dev; re-deriving an equivalent as inline `services:` would
# be duplicate, drifting configuration for no real benefit. Using the same
# compose file CI and developers both run also means "works in CI" and
# "works locally" stay the same claim.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Backend Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt

      - name: ruff format --check
        run: ruff format --check backend/

      - name: ruff check
        run: ruff check backend/

  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Start Postgres, Redis, Kafka
        run: docker compose up -d postgres redis kafka

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec robot-fleet-postgres pg_isready -U fleet_user -d robot_fleet && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do
            docker exec robot-fleet-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Kafka did not become ready in time" >&2
          exit 1

      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Run pytest
        run: python -m pytest backend/tests/ -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=200
