# Validation-only — no AWS credentials, no plan, no apply. Safe to run on
# every PR without any repository secrets configured. See
# infrastructure/terraform/README.md "CI/CD preparation" for the full
# pipeline this is step 6 of, and why plan/apply aren't wired up yet.
name: Terraform validate

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
