# The one pipeline: test, build, and (on main only) deploy.
#
# Why one workflow instead of separate CI and Docker workflows: deploy-dev
# `needs:` the test jobs, so a push to main can never deploy a commit whose
# own tests failed. Across separate workflows that dependency can't be
# expressed reliably — `workflow_run` can't wait on more than one upstream
# workflow, and never fires at all when the upstream was path-filtered out.
# The individual checks still live in their own files (backend-ci.yml,
# frontend-ci.yml, terraform.yml) as reusable workflows called from here.
#
# No workflow-level `paths:` filter, deliberately: branch protection
# requires the "CI passed" job below, and a workflow that never starts
# leaves a required check pending forever. Path filtering happens per job
# via the `changes` job instead — jobs skipped that way report "skipped",
# which "CI passed" treats as fine.
#
# Trust boundary matters here more than anywhere else in this repo:
#   - PRs (including from this same repo) only ever run tests and validate
#     that the images build and pass a Trivy scan — never touch AWS, never
#     request an OIDC token.
#   - Only a push to main authenticates to AWS, and only to push images +
#     update the two ECS services that actually exist for the "dev"
#     environment (infrastructure/terraform/environments/dev.tfvars).
#     The IAM trust policy (infrastructure/terraform/iam.tf) independently
#     enforces the same restriction at the AWS side, so this isn't the only
#     thing standing between a PR and production credentials.
#
# telemetry-consumer and simulator are deliberately NOT deployed here: per
# infrastructure/terraform/compute.tf, those two ECS services only exist
# when enable_kafka = true, which dev.tfvars currently sets to false. See
# docs/cicd.md "Known limitations" for what to add once that changes.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files via the API

# PRs: a new push cancels the now-stale run. main: runs queue instead of
# cancelling, so a deploy is never interrupted halfway through.
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ECS_CLUSTER: robot-fleet-dev-cluster

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      # Editing this file counts as a change to everything, so pipeline
      # changes are always exercised end to end before they merge.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline: &pipeline
              - ".github/workflows/ci-cd.yml"
            backend:
              - *pipeline
              - "backend/**"
              - "docker-compose.yml"
              - "pyproject.toml"
              - ".github/workflows/backend-ci.yml"
            frontend:
              - *pipeline
              - "frontend/**"
              - ".github/workflows/frontend-ci.yml"
            terraform:
              - *pipeline
              - "infrastructure/terraform/**"
              - ".github/workflows/terraform.yml"
            images:
              - *pipeline
              - "backend/**"
              - "frontend/**"
              - ".dockerignore"

  backend-ci:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml

  build-backend:
    name: Docker Build (backend)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only ever exercised below when github.event_name == 'push'
    outputs:
      image_ref: ${{ steps.set-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: set-image
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ steps.ecr.outputs.registry }}/robot-fleet-dev-backend" >> "$GITHUB_OUTPUT"
          else
            echo "ref=robot-fleet-backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (PR — validates the build only, never pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.set-image.outputs.ref }}:pr-${{ github.event.number }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push image (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # SHA tag only: the ECR repos are IMMUTABLE, so a floating tag like
          # :main could only ever be pushed once and every later deploy would
          # fail at this step.
          tags: ${{ steps.set-image.outputs.ref }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan image for critical vulnerabilities (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.set-image.outputs.ref }}:pr-${{ github.event.number }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan image for critical vulnerabilities (main)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.set-image.outputs.ref }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

  build-frontend:
    name: Docker Build (frontend)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.set-image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: set-image
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ steps.ecr.outputs.registry }}/robot-fleet-dev-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "ref=robot-fleet-frontend" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (PR — validates the build only, never pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.set-image.outputs.ref }}:pr-${{ github.event.number }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push image (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # SHA tag only: the ECR repos are IMMUTABLE, so a floating tag like
          # :main could only ever be pushed once and every later deploy would
          # fail at this step.
          tags: ${{ steps.set-image.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan image for critical vulnerabilities (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.set-image.outputs.ref }}:pr-${{ github.event.number }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan image for critical vulnerabilities (main)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.set-image.outputs.ref }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

  # The single check branch protection requires (docs/cicd.md #15) — one
  # stable name instead of a list that changes whenever a job is added, and
  # it passes when jobs were skipped by the path filter, which a required
  # check on a skipped job inside a never-started workflow wouldn't.
  ci-passed:
    name: CI passed
    needs: [changes, backend-ci, frontend-ci, terraform, build-backend, build-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that no job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A required job did not pass" >&2; exit 1 ;;
          esac

  deploy-dev:
    name: Deploy (dev)
    needs: [ci-passed, build-backend, build-frontend]
    # !cancelled() rather than the implicit success(): with success(), a test
    # job skipped by the path filter (e.g. backend-ci on a frontend-only
    # change) would skip the deploy too. ci-passed is what guarantees nothing
    # failed; the build results are checked so a run with no image changes
    # (both builds skipped) doesn't try to deploy a SHA that was never pushed.
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ci-passed.result == 'success'
      && needs.build-backend.result == 'success'
      && needs.build-frontend.result == 'success'
    runs-on: ubuntu-latest
    # No `environment:` on purpose. Declaring one changes the OIDC token's
    # "sub" claim from repo:<repo>:ref:refs/heads/main to
    # repo:<repo>:environment:<name>, which the IAM trust policy
    # (infrastructure/terraform/iam.tf) rejects, so AssumeRole would fail.
    # See docs/cicd.md #11 for what changing that would take.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition robot-fleet-dev-backend \
            --query taskDefinition > backend-task-def.json

      - name: Render new backend image into task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ needs.build-backend.outputs.image_ref }}:${{ github.sha }}

      - name: Deploy backend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: robot-fleet-dev-backend
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Fetch current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition robot-fleet-dev-frontend \
            --query taskDefinition > frontend-task-def.json

      - name: Render new frontend image into task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ needs.build-frontend.outputs.image_ref }}:${{ github.sha }}

      - name: Deploy frontend service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: robot-fleet-dev-frontend
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # /health/ready (not just /health) deliberately — it's the endpoint
      # that actually checks Postgres + Redis connectivity
      # (backend/app/main.py), so this proves the deployed service can
      # really serve traffic, not just that the process started.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "${{ vars.APP_HEALTH_URL }}/health/ready"; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after all retries" >&2
          exit 1
