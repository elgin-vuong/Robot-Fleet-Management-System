# Syntax/consistency validation only — no AWS credentials, no plan, no
# apply. Safe to run on every PR (including from forks) without any
# repository secrets configured.
#
# Deliberately NOT running `terraform plan` here: the GitHub OIDC deploy
# role this repo already has (infrastructure/terraform/iam.tf's
# github_actions_deploy) is scoped narrowly to ECR push + ECS deploy, on
# purpose — it cannot read VPC/RDS/IAM/etc. state, which is what `plan`
# would need. Granting a PR-triggered workflow broad read access across
# the whole account is a materially bigger, more sensitive decision than
# this task covers — see docs/cicd.md "Known limitations" for what a
# plan-capable role would need and why it's deliberately not built yet.
name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
