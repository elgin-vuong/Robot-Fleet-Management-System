# Serves the built React static assets. API/WebSocket routing to the
# backend is handled by the ALB's path-based listener rules (see
# infrastructure/terraform/modules/compute/alb.tf), not by this Nginx —
# the frontend's own fetch() calls use relative paths (e.g. "/robots",
# "/auth/login") and never reach this container for those requests once
# deployed behind the ALB.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real static file falls back
    # to index.html so client-side routing (if added later) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
