# Observability stack for the local kind cluster: OpenTelemetry Collector,
# Jaeger (trace storage/UI), Prometheus (metrics), and Grafana (dashboards).
# Mirrors docker-compose.yml's equivalent services — see
# infrastructure/observability/ for the shared config files (Prometheus's
# scrape config here uses Kubernetes service discovery instead of Compose's
# static container-name targets, since that's the idiomatic way to find
# pods in k8s; the Grafana dashboard JSON is the same file used by Compose,
# pulled in via kustomization.yaml's configMapGenerator).

# --- OpenTelemetry Collector ------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: robot-fleet
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: robot-fleet
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: robot-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.113.0
          args: ["--config=/etc/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
# --- Jaeger (trace storage + UI) ---------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: robot-fleet
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: robot-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317

---
# --- Prometheus ----------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: robot-fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robot-fleet-prometheus
rules:
  # Read-only, and only what's needed to discover scrape targets by pod
  # annotation (see backend.yaml / telemetry-consumer.yaml's
  # prometheus.io/* annotations) — no access to secrets or write verbs.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robot-fleet-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robot-fleet-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: robot-fleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: robot-fleet
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      # Discovers backend/telemetry-consumer pods via their
      # prometheus.io/scrape annotations (see infrastructure/k8s/backend.yaml
      # and telemetry-consumer.yaml) rather than a static target list, so
      # scaling replicas or rescheduling pods doesn't need a config change.
      - job_name: robot-fleet-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["robot-fleet"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
            labels:
              service: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: robot-fleet
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: robot-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
# --- Grafana ---------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: robot-fleet
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: robot-fleet
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: robot-fleet
        orgId: 1
        folder: "Robot Fleet"
        type: file
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# grafana-dashboard-robot-fleet ConfigMap (the actual dashboard JSON) is
# generated by kustomization.yaml's configMapGenerator from
# infrastructure/k8s/grafana-dashboards/robot-fleet.json — see that
# kustomization.yaml entry for why it's a copy of Docker Compose's
# infrastructure/observability/grafana/dashboards/robot-fleet.json rather
# than a shared reference.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: robot-fleet
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: robot-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: robot-fleet-secrets
                optional: true
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-robot-fleet
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-robot-fleet
          configMap:
            name: grafana-dashboard-robot-fleet
