# Copy this file to secret.yaml, fill in real values, and apply it —
# secret.yaml is gitignored and must never be committed.
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: robot-fleet-secrets
  namespace: robot-fleet
type: Opaque
stringData:
  POSTGRES_USER: fleet_user
  POSTGRES_PASSWORD: fleet_password
  POSTGRES_DB: robot_fleet
  # Must match the credentials above — kept in sync manually since Postgres
  # only reads POSTGRES_USER/PASSWORD/DB, while the app reads a single URL.
  DATABASE_URL: postgresql://fleet_user:fleet_password@postgres:5432/robot_fleet
  JWT_SECRET_KEY: change-me-to-a-random-secret
  AI_API_KEY: ""
  VOYAGE_API_KEY: ""
  # Grafana admin login (see infrastructure/k8s/observability.yaml). Grafana
  # defaults GF_SECURITY_ADMIN_PASSWORD to "admin" itself if this key is
  # absent, so leaving it out is fine for a local smoke test — set a real
  # value before this is reachable by anyone but the developer running it.
  GF_SECURITY_ADMIN_PASSWORD: admin
