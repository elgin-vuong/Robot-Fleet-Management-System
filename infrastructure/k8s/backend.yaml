apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: robot-fleet
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: robot-fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Scraped via kubernetes_sd_configs in
        # infrastructure/k8s/observability.yaml's Prometheus config,
        # rather than a static target list — this is how new/rescheduled
        # pods get picked up automatically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: backend
          image: robot-fleet-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: robot-fleet-config
            - secretRef:
                name: robot-fleet-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: robot-fleet-api
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
