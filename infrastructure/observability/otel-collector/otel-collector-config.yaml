# OpenTelemetry Collector: receives OTLP traces from the backend API,
# telemetry consumer, and simulator (each sets OTEL_EXPORTER_OTLP_ENDPOINT
# to this collector's container address — see docker-compose.yml), then
# forwards them to Jaeger for storage/viewing and exposes its own
# operational metrics for Prometheus to scrape.
#
# A collector sits between the app processes and the trace backend so that:
#   - app processes only need to know one stable endpoint, not Jaeger's;
#   - batching/retries happen centrally instead of in every process;
#   - the trace backend (Jaeger here) can be swapped later without any
#     application code or config changes.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # The collector's own health/throughput, scraped by Prometheus
  # (see infrastructure/observability/prometheus/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: info
